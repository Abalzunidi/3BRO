services:
  - type: web
    name: 3bro-api
    runtime: node
    rootDir: server
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_VERSION
        value: "22"
